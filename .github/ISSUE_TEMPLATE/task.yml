name: Task
description: A single piece of work for the t-workflow pipeline.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change and why.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable criteria that say the work is finished.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Paths the work may touch.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this task explicitly does not do.
    validations:
      required: true
