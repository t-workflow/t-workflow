# t-workflow's mechanical enforcement: .t-workflow/scripts/ci.sh on every pull request.
# Drafts skip it (the work/review window costs nothing); marking a PR ready starts it.
# A submitted review re-runs it, since a review is what a protected diff waits for.
name: t-workflow
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: t-workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  t-workflow:
    name: t-workflow
    if: github.event_name == 'pull_request_review' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: .t-workflow/scripts/ci.sh
