# t-workflow's mechanical enforcement: pull_request_target, not pull_request, so
# GitHub reads this workflow file from the base branch — a pull request cannot edit
# its own way past the gate here. The checkout stays on the base branch too; the PR's
# commit is only ever fetched as a ref (PR_REF, below) and read with git show/diff,
# never checked out or executed — actions/checkout itself now refuses to check out a
# fork PR's commit under this trigger, and a plain read has no reason to want to.
# Drafts skip it (the work/review window costs nothing); marking a PR ready starts it.
# One run per commit: a protected diff's run is red until its cold review exists, and
# /t-review re-runs that same run after posting (rerun-ci.sh) rather than triggering a
# second one, which branch protection would count alongside the red one.
name: t-workflow
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: t-workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  t-workflow:
    name: t-workflow
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_REF: refs/heads/_pr_head
        run: |
          git fetch -q origin "$BASE_REF"
          git fetch -q origin "refs/pull/$PR_NUMBER/head:$PR_REF"
          # Whichever of base or the PR has .t-workflow/scripts is what actually runs —
          # the base's copy normally, so a PR can't rewrite ci.sh itself; the PR's own
          # copy only the one time a repo is adopting t-workflow and the base has none
          # yet. Either way it runs against the checkout (the base branch) and reads
          # the PR only through PR_REF, never executing anything from it.
          if git cat-file -e "origin/$BASE_REF:.t-workflow/scripts/ci.sh" 2>/dev/null; then
            scripts_ref="origin/$BASE_REF"
          else
            scripts_ref="$PR_REF"
          fi
          gate_scripts="$(mktemp -d)"
          git archive "$scripts_ref" .t-workflow/scripts | tar -x -C "$gate_scripts"
          "$gate_scripts/.t-workflow/scripts/ci.sh"
