# This repository's own script tests (tests/test.sh). Consumers never receive this file.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: curl -fsSL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz && tar -xJf /tmp/sc.tar.xz -C /tmp
      - run: /tmp/shellcheck-v0.10.0/shellcheck --severity=warning install.sh tests/test.sh .t-workflow/scripts/*.sh
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the suite bare-clones this checkout; a shallow source makes install.sh's filtered clone crawl
      - run: tests/test.sh
